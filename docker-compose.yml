services:
  waver_ros:
    build:
      context: .
      dockerfile: Dockerfile
    image: waver_ros:jazzy
    container_name: waver
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
      - .:/waver_ros
    working_dir: /waver_ros
    command: ["tail", "-f", "/dev/null"]
    stdin_open: true
    tty: true

  ros_portal:
    # Built, not pulled: the upstream image's libcamera cannot drive the Pi's
    # CSI camera. See Dockerfile.ros_portal for why.
    build:
      context: .
      dockerfile: Dockerfile.ros_portal
    image: waver_ros_portal:jazzy-gst.sdd-libcamera
    container_name: ros_portal
    network_mode: host
    privileged: true
    # Privileged gives access to host /dev, including /dev/video*
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?Set LIVEKIT_URL}
      LIVEKIT_TOKEN: ${LIVEKIT_TOKEN:?Set LIVEKIT_TOKEN}
    volumes:
      - /dev:/dev
      # libcamera enumerates the CSI sensor through udev. Without the host's
      # udev database it finds no cameras at all and libcamerasrc fails with
      # "Could not find any supported camera on this system", even though
      # /dev/media* and /dev/video* are already visible via /dev above.
      - /run/udev:/run/udev:ro
      - ${LIVEKIT_CONFIG:-./src/waver_bringup/config/livekit_robot.yaml}:/tmp/livekit_portal.yaml:ro
    command:
      - ros2
      - launch
      - ros_portal
      - ros_portal.launch.py
      - config_path:=/tmp/livekit_portal.yaml
