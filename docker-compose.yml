# On-robot deployment.
#
#   docker compose build          # ~hours natively on a Pi 4; see README
#   docker compose run --rm waver # interactive shell, then `waver`
#   docker compose up             # launch the full stack

services:
  waver:
    build:
      context: .
      args:
        # Keep at the libcamera the host has installed: dpkg -l | grep libcamera
        LIBCAMERA_VERSION: v0.7.1+rpt20260429
    image: waver_ros:latest
    container_name: waver

    # libcamera needs /dev/video*, /dev/media*, and /dev/dma_heap; the rover
    # board and lidar need their tty devices. Enumerating them individually is
    # brittle across camera modules and USB re-enumeration, so the container runs
    # privileged. It is a single-purpose image on a dedicated robot.
    privileged: true

    # libcamera enumerates cameras through udev. Without the host's udev runtime
    # directory, libcamerasrc reports "Could not find any supported camera on
    # this system" even though /dev/media* is present.
    volumes:
      - /run/udev:/run/udev:ro

    # host networking so the LiveKit connection and any local ROS tooling share
    # the Pi's stack; host IPC so GStreamer/DDS shared memory works.
    network_mode: host
    ipc: host

    environment:
      # Populate from a .env file next to this compose file (git-ignored).
      LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL in .env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      # Override to SUBNET to reach the ROS graph from another machine.
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}

    # Reaps the driver's serial reader thread and the nav2 lifecycle nodes
    # cleanly on Ctrl-C.
    init: true
    stop_grace_period: 10s
    restart: unless-stopped

    command:
      - /bin/bash
      - -lc
      - ros2 launch waver_bringup waver.launch.xml
