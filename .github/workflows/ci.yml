name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Mirror the developer workflow: clone dependencies on the host, build the
  # Docker image, then rosdep + colcon build inside a container with the
  # workspace bind-mounted.
  # ---------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-vcstool

      - name: Start SSH agent for private repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup repos
        run: ./scripts/setup_repos.sh

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --build-arg LIBCAMERA_VERSION=v0.7.1+rpt20260429 \
            -t waver_ros:ci \
            .

      - name: Build workspace in container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/waver_ws" \
            -w /waver_ws \
            waver_ros:ci \
            bash -lc './scripts/rosdep_update.sh && colcon build --packages-up-to waver_bringup --cmake-args -DCMAKE_BUILD_TYPE=Release'

      - name: Test
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/waver_ws" \
            -w /waver_ws \
            waver_ros:ci \
            bash -lc 'colcon test --packages-select waver_driver --event-handlers console_direct+ && colcon test-result --verbose'

  # ---------------------------------------------------------------------------
  # Cheap static checks that do not need ROS.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh setup-shell-env.sh

      - name: XML and YAML are well-formed
        run: |
          set -euo pipefail
          sudo apt-get install -y libxml2-utils
          # Vendored trees are upstream's problem, not ours.
          find src .github -name '*.xml' -not -path 'src/vendor/*' -print0 \
            | xargs -0 -r xmllint --noout
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          failures = []
          for path in pathlib.Path('.').rglob('*.y*ml'):
              if 'vendor' in path.parts:
                  continue
              try:
                  # ROS param files and GitHub workflows both parse as plain YAML.
                  list(yaml.safe_load_all(path.read_text()))
              except yaml.YAMLError as exc:
                  failures.append(f'{path}: {exc}')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('all YAML parsed')
          PY

      - name: Dependency pins are SHAs, not branches
        shell: bash
        run: |
          set -euo pipefail
          # A moving branch pin makes the robot's build unreproducible.
          if grep -nE '^\s+version:\s' waver.repos | grep -vE '[0-9a-f]{40}'; then
            echo "::error::waver.repos has a non-SHA pin (see the lines above)"
            exit 1
          fi
          echo "all pins are SHAs"
