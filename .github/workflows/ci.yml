name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Host needs only Docker Compose (preinstalled on ubuntu-latest). Stub
  # LiveKit credentials so compose can interpolate ros_portal env vars while
  # we only build the waver_ros image (vcs + rosdep + colcon happen in the
  # Dockerfile).
  #
  # waver_ros is named explicitly rather than building every service: the
  # ros_portal service builds FROM livekit/ros-portal, which is a private
  # Docker Hub repository, so an unauthenticated runner cannot resolve it
  # ("insufficient_scope: authorization failed"). Even with credentials it
  # would be a poor CI target -- Dockerfile.ros_portal compiles libcamera's
  # rpi/vc4 pipeline for the Pi, which on an amd64 runner means emulation for
  # a code path that cannot be exercised without CSI hardware anyway.
  # ---------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: wss://stub.example.com
      LIVEKIT_TOKEN: stub-token
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build waver_ros

  # ---------------------------------------------------------------------------
  # Cheap static checks that do not need ROS.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: XML and YAML are well-formed
        run: |
          set -euo pipefail
          sudo apt-get install -y libxml2-utils python3-yaml
          # Vendored trees are upstream's problem, not ours.
          find src .github -name '*.xml' -not -path 'src/vendor/*' -print0 \
            | xargs -0 -r xmllint --noout
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          failures = []
          for path in pathlib.Path('.').rglob('*.y*ml'):
              if 'vendor' in path.parts:
                  continue
              try:
                  # ROS param files and GitHub workflows both parse as plain YAML.
                  list(yaml.safe_load_all(path.read_text()))
              except yaml.YAMLError as exc:
                  failures.append(f'{path}: {exc}')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('all YAML parsed')
          PY

      - name: Dependency pins are SHAs, not branches
        shell: bash
        run: |
          set -euo pipefail
          # A moving branch pin makes the robot's build unreproducible.
          if grep -nE '^\s+version:\s' waver.repos | grep -vE '[0-9a-f]{40}'; then
            echo "::error::waver.repos has a non-SHA pin (see the lines above)"
            exit 1
          fi
          echo "all pins are SHAs"
